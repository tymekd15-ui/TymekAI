<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TymekAI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #202123;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px;
            text-align: center;
            background: #171717;
            font-size: 24px;
            font-weight: bold;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 700px;
            margin: 12px auto;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .user {
            background: #343541;
        }

        .ai {
            background: #444654;
        }

        .input-area {
            display: flex;
            max-width: 750px;
            width: 90%;
            margin: auto;
            padding: 15px 0;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
        }

        button {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    🤖 TymekAI
</header>

<div id="chat">
    <div class="message ai">
        Cześć! Jestem TymekAI. 👋
    </div>
</div>

<div class="input-area">
    <input id="input" placeholder="Napisz wiadomość...">
    <button onclick="sendMessage()">Wyślij</button>
</div>

<script>
function sendMessage() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    if (input.value.trim() === "") return;

    const message = document.createElement("div");
    message.className = "message user";
    message.textContent = input.value;

    chat.appendChild(message);

    input.value = "";
}
</script>

</body>
</html>
